<!doctype html>
<html lang="ja">
  <head>
    <title>四則演算ドリル</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.3/css/bulma.min.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="メインナビゲーション">
      <div class="navbar-start">
        <div class="navbar-item">
          <div class="select">
            <select id="levelSelect" aria-label="学年レベルを選択">
              <option value="3">小3（100問）</option>
              <option value="4">小4（20問）</option>
              <option value="5">小5（初歩15問）</option>
              <option value="51">小5小数（初歩15問）</option>
              <option value="52">小5小数わり算（8問）</option>
              <option value="6">小6（11問）</option>
            </select>
          </div>
        </div>
        <div class="navbar-item">
          <div class="select">
            <select id="timeSelect" aria-label="制限時間を選択">
              <option value="2" selected>2分</option>
              <option value="3">3分</option>
              <option value="4">4分</option>
              <option value="5">5分</option>
              <option value="6">6分</option>
              <option value="7">7分</option>
              <option value="8">8分</option>
              <option value="9">9分</option>
              <option value="10">10分</option>
              <option value="11">11分</option>
              <option value="12">12分</option>
              <option value="13">13分</option>
              <option value="14">14分</option>
              <option value="15">15分</option>
            </select>
          </div>
        </div>
        <div
          id="timer"
          class="navbar-item"
          role="timer"
          aria-live="polite"
          aria-atomic="true"
          aria-label="残り時間"
        ></div>
        <div class="buttons">
          <button
            id="actionButton"
            class="button is-primary"
            aria-label="ドリルを開始する"
          >START</button>
        </div>
      </div>
    </nav>
    <section class="section">
      <div class="container">
        <h1 class="title has-text-grey-lighter has-text-centered">四則演算ドリル</h1>

        <div class="content hide" role="main" aria-label="問題リスト">
          <ol id="formula" aria-label="四則演算問題"></ol>
        </div>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
